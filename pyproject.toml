[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "pyfe"
version = "2.0.0"
authors = [
  { name="Dr. Eros Montin, PhD", email="eros.montin@gmail.com" },
]
description = "pyfe - Feature Extraction and Machine Learning for Radiomics"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0,<2.0",
    "pynico",
    "scipy>=1.7.0",
    "toml",
    "benford_py",
    "trimesh",
    "pyable",
    "pydaug @ git+https://github.com/erosmontin/pydaug.git",
    "pyradiomics>=3.0.0",
    "pyable-ml[optuna,plotting]",
    "tqdm>=4.60.0",
    "imbalanced-learn>=0.9.0",
]

[project.optional-dependencies]
advanced = [
    "lightgbm>=3.3.0",
    "xgboost>=1.6.0",
    "catboost>=1.0.0",
]
qubo = [
    "qubo-selector>=0.1.0",
]
all = [
    "lightgbm>=3.3.0",
    "xgboost>=1.6.0",
    "catboost>=1.0.0",
    "qubo-selector>=0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/erosmontin/pyfe"
"Bug Tracker" = "https://github.com/erosmontin/pyfe/issues"

